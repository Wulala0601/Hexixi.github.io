<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>Mint Catgirl · Digital Universe</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    body.hub-page {
      background-image: url("assets/images/mint-polka-bg.jpg");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }
    .pink-code-decor { position: fixed; right: clamp(18px, 4vw, 64px); bottom: 92px; z-index: 0; color: #ff79bc; font: 800 clamp(44px, 7vw, 104px)/.8 Arial, sans-serif; letter-spacing: -10px; opacity: .68; transform: rotate(-7deg); pointer-events: none; text-shadow: 0 8px 22px rgba(255, 179, 198, .25); }
    .pink-code-decor sup { position: relative; top: -1em; margin-left: 3px; font-size: .42em; letter-spacing: 0; }
    .link-bag,
    .link-music { display: grid; justify-items: center; gap: 7px; }
    .link-bag i,
    .link-music i { display: none; }
    .link-bag .bag-mark,
    .link-music .mp3-mark { width: 58px; height: 58px; object-fit: cover; box-shadow: 4px 8px 13px rgba(13, 31, 26, .25); transition: transform .16s ease, box-shadow .16s ease; }
    .link-bag .bag-mark { width: 86px; height: 92px; object-fit: contain; border-radius: 0; box-shadow: none; mask: url("assets/images/bag-nav-mask.svg") center / contain no-repeat; -webkit-mask: url("assets/images/bag-nav-mask.svg") center / contain no-repeat; }
    .link-bag span,
    .link-music span { opacity: 1; transform: none; padding: 0; border: 0; background: transparent; color: #0D1F1A; font-weight: 700; }
    .link-bag:hover .bag-mark,
    .link-music:hover .mp3-mark { transform: translateY(-2px) rotate(-3deg); box-shadow: 6px 11px 16px rgba(13, 31, 26, .3); }
    .link-bag:active .bag-mark,
    .link-music:active .mp3-mark { transform: scale(.84) rotate(-3deg); box-shadow: 2px 4px 7px rgba(13, 31, 26, .2); }
    .hub-page .link-bag,
    .hub-page .link-bag:hover,
    .hub-page .link-music,
    .hub-page .link-music:hover { border: 0; border-radius: 0; background: transparent; box-shadow: none; backdrop-filter: none; }
    .hub-page .link-bag span { color: #fff; background: transparent; border: 0; backdrop-filter: none; text-shadow: 0 2px 8px rgba(20,17,29,.75); }
    .hub-page .link-bag:hover .bag-mark,
    .hub-page .link-bag:active .bag-mark { box-shadow: none; }
    .hub-page .link-bag:focus-visible { outline: 2px solid #ffd0e7; outline-offset: 5px; }
    @media (prefers-reduced-motion: reduce) { .hub-page .link-bag, .hub-page .link-bag .bag-mark { transition: none; } }
    @media (max-width: 760px) { .pink-code-decor { right: 18px; bottom: 90px; font-size: 50px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js" } }
  </script>
